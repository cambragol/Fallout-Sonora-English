; ============================================================================
; Mod Configuration File
; ============================================================================
; This file contains all mod‑adjustable settings for the game.
; Changes take effect after restarting the game.
;
; Syntax:
;   [section_name]
;   key=value
;
; Comments start with ';' or '#'.
; ============================================================================

[mod_settings]
; ----------------------------------------------------------------------------
; Game Start Parameters
; ----------------------------------------------------------------------------
StartYear=2167       ; Starting year of the game
StartMonth=3        ; Starting month (1-12)
StartDay=11         ; Starting day (1-31)
StartingMap=         ; Override the initial map (e.g., "artemple.map")

; ----------------------------------------------------------------------------
; Movie Timers (artimer values)
; ----------------------------------------------------------------------------
MovieTimer_artimer1=90   ; Timer for intro movies
MovieTimer_artimer2=180
MovieTimer_artimer3=270
MovieTimer_artimer4=360

; ----------------------------------------------------------------------------
; Interface & UI
; ----------------------------------------------------------------------------
;PipBoyAvailableAtGameStart=0   ; 1 = PipBoy available immediately, 0 = normal
;MainMenuBigFontColour=0        ; RGB colour for big main menu font (0 = default)
;MainMenuCreditsOffsetX=0       ; Horizontal offset for credits text
;MainMenuCreditsOffsetY=0       ; Vertical offset for credits text
;MainMenuFontColour=0           ; RGB colour for main menu font
;MainMenuOffsetX=0              ; Horizontal offset for main menu items
;MainMenuOffsetY=0              ; Vertical offset for main menu items

; ----------------------------------------------------------------------------
; Critical Hit Overrides
; ----------------------------------------------------------------------------
OverrideCriticalTable=2        ; 0 = none, 1 = override file only, 2 = override mode + file
OverrideCriticalFile=          ; Path to custom critical tables file

; ----------------------------------------------------------------------------
; Pre‑made Characters
; ----------------------------------------------------------------------------
;PremadePaths=                  ; Comma‑separated list of pre‑made character files
;PremadeFIDs=                   ; Corresponding face FIDs for each pre‑made character

; ----------------------------------------------------------------------------
; Character Appearance (Dude Native Look)
; ----------------------------------------------------------------------------
;MaleDefaultModel=              ; Default model for male player (jumpsuit)
;FemaleDefaultModel=            ; Default model for female player (jumpsuit)
;MaleStartModel=                ; Starting model for male player (tribal)
;FemaleStartModel=              ; Starting model for female player (tribal)

; ----------------------------------------------------------------------------
; Karma System
; ----------------------------------------------------------------------------
;KarmaFRMs=                     ; FRM file for karma display
;KarmaPoints=                   ; Points for each karma level (comma‑separated)

; ----------------------------------------------------------------------------
; Explosives Damage
; ----------------------------------------------------------------------------
Dynamite_DmgMin=30             ; Minimum damage for dynamite
Dynamite_DmgMax=50             ; Maximum damage for dynamite
PlasticExplosive_DmgMin=40     ; Minimum damage for plastic explosives
PlasticExplosive_DmgMax=80     ; Maximum damage for plastic explosives

; ----------------------------------------------------------------------------
; City Reputation & Unarmed
; ----------------------------------------------------------------------------
;CityRepsList=                  ; File containing city reputation definitions
;UnarmedFile=                   ; File with unarmed attack animations

; ----------------------------------------------------------------------------
; Combat & Damage Formulas
; ----------------------------------------------------------------------------
DamageFormula=0                ; 0 = original, 1 = alternate formula
BonusHtHDamageFix=1            ; 1 = fix bonus HtH damage calculation, 0 = original

; ----------------------------------------------------------------------------
; Skill FRM Overrides (FRM IDs for skill usage animations)
; ----------------------------------------------------------------------------
;Lockpick=293                   ; FRM ID for lockpick skill
;Steal=293                      ; FRM ID for steal skill
;Traps=293                      ; FRM ID for traps skill
;FirstAid=293                   ; FRM ID for first aid skill
;Doctor=293                     ; FRM ID for doctor skill
;Science=293                    ; FRM ID for science skill
;Repair=293                     ; FRM ID for repair skill

; ----------------------------------------------------------------------------
; Science/Repair Target Type
; ----------------------------------------------------------------------------
ScienceOnCritters=0            ; 1 = science works on critters, 0 = only on objects

; ----------------------------------------------------------------------------
; Dialogue & Text Fixes
; ----------------------------------------------------------------------------
DialogueFix=1                  ; 1 = enable dialogue fixes, 0 = original
DialogGenderWords=0            ; 1 = use gender‑specific words in dialogue, 0 = off
TownMapHotkeysFix=1            ; 1 = fix town map hotkeys, 0 = original
NumbersInDialogue=0            ; 1 = allow numbers in dialogue responses, 0 = off

; ----------------------------------------------------------------------------
; Additional Files & Patches
; ----------------------------------------------------------------------------
;TweaksFile=                    ; Additional tweaks file
;ExtraGameMsgFileList=          ; Extra message files (comma‑separated)
;PatchFile=                     ; Patch file to apply
VersionString=FALLOUT SONORA 1.16.4e	; Version identifier (for mods)

; ----------------------------------------------------------------------------
; Gameplay Tweaks
; ----------------------------------------------------------------------------
UseWalkDistance=5              ; Distance threshold for walking vs running
WorldMapTravelMarkers=1       ; 1 = show travel markers on world map, 0 = hide

; ----------------------------------------------------------------------------
; Burst Fire Mod (advanced bullet spray)
; ----------------------------------------------------------------------------
ComputeSprayMod=0              ; 1 = enable burst fire mod, 0 = original
ComputeSpray_CenterMult=1      ; Center multiplier for spray calculation
ComputeSpray_CenterDiv=3       ; Center divisor
ComputeSpray_TargetMult=1      ; Target multiplier
ComputeSpray_TargetDiv=2       ; Target divisor

; ----------------------------------------------------------------------------
; Interface Bar (iface_bar) Settings
; ----------------------------------------------------------------------------
;IFACE_BAR_MODE=1               ; 1 = use custom interface bar, 0 = original
;IFACE_BAR_WIDTH=800            ; Width of interface bar
;IFACE_BAR_SIDE_ART=0           ; Side art variant (0 = none)
;IFACE_BAR_SIDES_ORI=0          ; 1 = swap sides, 0 = normal

; ----------------------------------------------------------------------------
; Other
; ----------------------------------------------------------------------------
; (No additional settings currently)

[mod_scripts]
; ----------------------------------------------------------------------------
; Script‑related paths
; ----------------------------------------------------------------------------
;IniConfigFolder=               ; Folder containing per‑script INI configs
;GlobalScriptPaths=             ; Additional paths for script search (semicolon‑separated)